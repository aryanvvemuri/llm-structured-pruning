<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 536" width="880" height="536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Token F1 against model size for pruned, layer-dropped and quantized Qwen2.5-0.5B</title>
<desc id="d">8-bit quantization keeps the unpruned score at about half the size. 20 percent MLP pruning costs at most about 1.6 F1. 4-bit quantization and dropping seven layers cost 3 to 6 F1.</desc>
<rect width="880" height="536" rx="8" fill="#1a1a19"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#f0efec">8-bit quantization halves the model for free; 20% pruning costs about 1 F1</text>
<text x="24" y="56" font-size="12.5" fill="#c3c2b7">Token F1 on the development holdout (mean of 5 seeds) against weight size. Seed-to-seed sd is 0.4–1.6 F1,</text>
<text x="24" y="73" font-size="12.5" fill="#c3c2b7">so points closer than about 1.5 F1 are not reliably different.</text>
<circle cx="31.0" cy="98.0" r="5.0" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/>
<text x="44" y="102" font-size="12.5" fill="#c3c2b7">Unpruned, 16-bit</text>
<circle cx="178.6" cy="98.0" r="5.0" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="191.6" y="102" font-size="12.5" fill="#c3c2b7">MLP pruning, 16-bit</text>
<path d="M347.5 91.5 L354.0 98.0 L347.5 104.5 L341.0 98.0 Z" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<text x="360.5" y="102" font-size="12.5" fill="#c3c2b7">Layer dropping, 16-bit</text>
<rect x="533.2" y="93.5" width="9.0" height="9.0" rx="1.5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="550.7" y="102" font-size="12.5" fill="#c3c2b7">Quantized (MLX)</text>
<line x1="70" x2="850" y1="452.0" y2="452.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="60" y="456.0" font-size="12" text-anchor="end" fill="#898781">48</text>
<line x1="70" x2="850" y1="374.5" y2="374.5" stroke="#2c2c2a" stroke-width="1"/>
<text x="60" y="378.5" font-size="12" text-anchor="end" fill="#898781">50</text>
<line x1="70" x2="850" y1="297.0" y2="297.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="60" y="301.0" font-size="12" text-anchor="end" fill="#898781">52</text>
<line x1="70" x2="850" y1="219.5" y2="219.5" stroke="#2c2c2a" stroke-width="1"/>
<text x="60" y="223.5" font-size="12" text-anchor="end" fill="#898781">54</text>
<line x1="70" x2="850" y1="142.0" y2="142.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="60" y="146.0" font-size="12" text-anchor="end" fill="#898781">56</text>
<line x1="70" x2="850" y1="452" y2="452" stroke="#383835" stroke-width="1"/>
<line x1="112.4" x2="112.4" y1="452" y2="457" stroke="#383835" stroke-width="1"/>
<text x="112.4" y="472" font-size="12" text-anchor="middle" fill="#898781">200</text>
<line x1="282.0" x2="282.0" y1="452" y2="457" stroke="#383835" stroke-width="1"/>
<text x="282.0" y="472" font-size="12" text-anchor="middle" fill="#898781">400</text>
<line x1="451.5" x2="451.5" y1="452" y2="457" stroke="#383835" stroke-width="1"/>
<text x="451.5" y="472" font-size="12" text-anchor="middle" fill="#898781">600</text>
<line x1="621.1" x2="621.1" y1="452" y2="457" stroke="#383835" stroke-width="1"/>
<text x="621.1" y="472" font-size="12" text-anchor="middle" fill="#898781">800</text>
<line x1="790.7" x2="790.7" y1="452" y2="457" stroke="#383835" stroke-width="1"/>
<text x="790.7" y="472" font-size="12" text-anchor="middle" fill="#898781">1000</text>
<text x="460.0" y="494" font-size="12.5" text-anchor="middle" fill="#c3c2b7">Weight size (MB) — smaller is better</text>
<text x="24" y="130" font-size="12.5" fill="#c3c2b7">Token F1 — higher is better</text>
<line x1="70" x2="850" y1="185.0" y2="185.0" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
<text x="76" y="179.0" font-size="11.5" fill="#898781">unpruned quality, 54.89</text>
<circle cx="780.6" cy="185.0" r="6.0" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/>
<text x="772.6" y="172.0" font-size="12" text-anchor="start" fill="#f0efec">Unpruned <tspan fill="#c3c2b7">54.9</tspan></text>
<circle cx="696.5" cy="207.1" r="6.0" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="696.5" y="228.1" font-size="12" text-anchor="middle" fill="#f0efec">Uniform 10% <tspan fill="#c3c2b7">54.3</tspan></text>
<circle cx="612.5" cy="247.0" r="6.0" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="600.5" y="251.0" font-size="12" text-anchor="end" fill="#f0efec">Uniform 20% <tspan fill="#c3c2b7">53.3</tspan></text>
<circle cx="613.1" cy="197.0" r="6.0" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="601.1" y="201.0" font-size="12" text-anchor="end" fill="#f0efec">Curve 20% <tspan fill="#c3c2b7">54.6</tspan></text>
<path d="M704.7 174.0 L712.2 181.5 L704.7 189.0 L697.2 181.5 Z" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<text x="704.7" y="168.5" font-size="12" text-anchor="middle" fill="#f0efec">Drop 3 layers <tspan fill="#c3c2b7">55.0</tspan></text>
<path d="M612.8 215.1 L620.3 222.6 L612.8 230.1 L605.3 222.6 Z" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<text x="600.8" y="226.6" font-size="12" text-anchor="end" fill="#f0efec">Drop 3 layers + uniform 20% <tspan fill="#c3c2b7">53.9</tspan></text>
<path d="M603.5 357.3 L611.0 364.8 L603.5 372.3 L596.0 364.8 Z" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<text x="615.5" y="368.8" font-size="12" text-anchor="start" fill="#f0efec">Drop 7 layers <tspan fill="#c3c2b7">50.2</tspan></text>
<rect x="382.4" y="178.7" width="11.0" height="11.0" rx="1.5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="387.9" y="171.2" font-size="12" text-anchor="middle" fill="#f0efec">Unpruned, 8-bit <tspan fill="#c3c2b7">54.9</tspan></text>
<rect x="293.2" y="241.1" width="11.0" height="11.0" rx="1.5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="298.7" y="267.6" font-size="12" text-anchor="middle" fill="#f0efec">Uniform 20%, 8-bit <tspan fill="#c3c2b7">53.3</tspan></text>
<rect x="173.1" y="348.8" width="11.0" height="11.0" rx="1.5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="190.6" y="358.3" font-size="12" text-anchor="start" fill="#f0efec">Unpruned, 4-bit <tspan fill="#c3c2b7">50.5</tspan></text>
<rect x="125.8" y="422.5" width="11.0" height="11.0" rx="1.5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="143.3" y="432.0" font-size="12" text-anchor="start" fill="#f0efec">Uniform 20%, 4-bit <tspan fill="#c3c2b7">48.6</tspan></text>
<text x="24" y="522" font-size="11" fill="#898781">Qwen2.5-0.5B-Instruct on Doc2Dial replies. Token F1 is word overlap, not accuracy. Original model without training: 22.1 (off the chart).</text>
</svg>
