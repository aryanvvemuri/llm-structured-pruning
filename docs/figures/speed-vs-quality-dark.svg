<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 536" width="880" height="536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Pruning 20% of the model makes it 7–10% faster with no detectable quality loss</title>
<desc id="d">Uniform 20 percent pruning is about 7 percent faster than the unpruned model and dropping three layers as well is about 10 percent faster, both within noise of the unpruned score. Dropping seven layers is about 23 percent faster but loses 4.6 F1.</desc>
<rect width="880" height="536" rx="8" fill="#1a1a19"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#f0efec">Pruning 20% of the model makes it 7–10% faster with no detectable quality loss</text>
<text x="24" y="56" font-size="12.5" fill="#c3c2b7">Token F1 (development holdout, mean of 5 seeds) against batched generation speed. Bars are 95% intervals on speed.</text>
<text x="24" y="73" font-size="12.5" fill="#c3c2b7">Seed-to-seed sd is 0.4–1.3 F1, so points closer than about 1.5 F1 are not reliably different.</text>
<circle cx="31.0" cy="98.0" r="5.0" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/>
<text x="44" y="102" font-size="12.5" fill="#c3c2b7">Unpruned</text>
<circle cx="127.8" cy="98.0" r="5.0" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="140.8" y="102" font-size="12.5" fill="#c3c2b7">MLP pruning</text>
<path d="M245.9 91.5 L252.4 98.0 L245.9 104.5 L239.4 98.0 Z" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<text x="258.9" y="102" font-size="12.5" fill="#c3c2b7">Layer dropping</text>
<line x1="70" x2="850" y1="407.7" y2="407.7" stroke="#2c2c2a" stroke-width="1"/>
<text x="60" y="411.7" font-size="12" text-anchor="end" fill="#898781">50</text>
<line x1="70" x2="850" y1="319.1" y2="319.1" stroke="#2c2c2a" stroke-width="1"/>
<text x="60" y="323.1" font-size="12" text-anchor="end" fill="#898781">52</text>
<line x1="70" x2="850" y1="230.6" y2="230.6" stroke="#2c2c2a" stroke-width="1"/>
<text x="60" y="234.6" font-size="12" text-anchor="end" fill="#898781">54</text>
<line x1="70" x2="850" y1="142.0" y2="142.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="60" y="146.0" font-size="12" text-anchor="end" fill="#898781">56</text>
<line x1="70" x2="850" y1="452" y2="452" stroke="#383835" stroke-width="1"/>
<line x1="148.0" x2="148.0" y1="452" y2="457" stroke="#383835" stroke-width="1"/>
<text x="148.0" y="472" font-size="12" text-anchor="middle" fill="#898781">0%</text>
<line x1="278.0" x2="278.0" y1="452" y2="457" stroke="#383835" stroke-width="1"/>
<text x="278.0" y="472" font-size="12" text-anchor="middle" fill="#898781">+5%</text>
<line x1="408.0" x2="408.0" y1="452" y2="457" stroke="#383835" stroke-width="1"/>
<text x="408.0" y="472" font-size="12" text-anchor="middle" fill="#898781">+10%</text>
<line x1="538.0" x2="538.0" y1="452" y2="457" stroke="#383835" stroke-width="1"/>
<text x="538.0" y="472" font-size="12" text-anchor="middle" fill="#898781">+15%</text>
<line x1="668.0" x2="668.0" y1="452" y2="457" stroke="#383835" stroke-width="1"/>
<text x="668.0" y="472" font-size="12" text-anchor="middle" fill="#898781">+20%</text>
<line x1="798.0" x2="798.0" y1="452" y2="457" stroke="#383835" stroke-width="1"/>
<text x="798.0" y="472" font-size="12" text-anchor="middle" fill="#898781">+25%</text>
<text x="460.0" y="494" font-size="12.5" text-anchor="middle" fill="#c3c2b7">Generation speed against the unpruned model (batch 16) — further right is faster</text>
<text x="24" y="130" font-size="12.5" fill="#c3c2b7">Token F1 — higher is better</text>
<line x1="70" x2="850" y1="191.2" y2="191.2" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
<text x="844" y="206.2" font-size="11.5" text-anchor="end" fill="#898781">unpruned quality, 54.89</text>
<line x1="311.8" x2="376.8" y1="262.0" y2="262.0" stroke="#3987e5" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
<line x1="267.6" x2="343.0" y1="187.2" y2="187.2" stroke="#199e70" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
<line x1="345.6" x2="454.8" y1="234.1" y2="234.1" stroke="#199e70" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
<line x1="699.2" x2="782.4" y1="396.6" y2="396.6" stroke="#199e70" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
<circle cx="148.0" cy="191.2" r="6.0" fill="#c3c2b7" stroke="#1a1a19" stroke-width="2"/>
<text x="148.0" y="213.2" font-size="12" text-anchor="middle" fill="#f0efec">Unpruned <tspan fill="#c3c2b7">54.9</tspan></text>
<circle cx="335.2" cy="262.0" r="6.0" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="335.2" y="284.0" font-size="12" text-anchor="middle" fill="#f0efec">Uniform 20% <tspan fill="#c3c2b7">+7%, 53.3 F1</tspan></text>
<path d="M301.4 179.7 L308.9 187.2 L301.4 194.7 L293.9 187.2 Z" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<text x="301.4" y="173.2" font-size="12" text-anchor="middle" fill="#f0efec">Drop 3 layers <tspan fill="#c3c2b7">+6%, 55.0 F1</tspan></text>
<path d="M408.0 226.6 L415.5 234.1 L408.0 241.6 L400.5 234.1 Z" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<text x="464.0" y="238.1" font-size="12" text-anchor="start" fill="#f0efec">Drop 3 layers + uniform 20% <tspan fill="#c3c2b7">+10%, 53.9 F1</tspan></text>
<path d="M735.6 389.1 L743.1 396.6 L735.6 404.1 L728.1 396.6 Z" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<text x="735.6" y="382.6" font-size="12" text-anchor="middle" fill="#f0efec">Drop 7 layers <tspan fill="#c3c2b7">+23%, 50.2 F1</tspan></text>
<text x="24" y="522" font-size="11" fill="#898781">Qwen2.5-0.5B-Instruct on Doc2Dial replies. PyTorch, float16, one Apple GPU, 64 forced tokens, 50 repeats. Token F1 is word overlap, not accuracy.</text>
</svg>
