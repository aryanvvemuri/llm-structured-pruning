[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prune-lab"
version = "0.1.0"
description = "Local, reproducible Qwen MLP neuron pruning experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers>=4.45,<5", "accelerate>=0.34", "safetensors>=0.4", "psutil>=5.9"]

[project.optional-dependencies]
gsm8k = ["datasets>=2.20"]
test = ["pytest>=8"]
# MLX quantization baselines (improvement 4). mlx-lm >= 0.30 requires transformers 5; this project pins 4.x.
quantize = ["mlx-lm==0.29.1"]

[project.scripts]
prune-lab = "prune_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
